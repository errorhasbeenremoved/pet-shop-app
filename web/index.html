<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#236b55">
  <meta name="description" content="Зоомаркет — каталог товаров для домашних животных">
  <title>Зоомаркет</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    html,body{height:100%;margin:0;background:#f4f7f3;font-family:Arial,sans-serif}
    #app-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#194d3d;background:linear-gradient(145deg,#f4f7f3,#e4f0e8);z-index:9999}
    .paw{font-size:48px}.app-title{font-size:24px;font-weight:700;letter-spacing:.2px}.app-subtitle{font-size:14px;color:#58766a}.spinner{width:34px;height:34px;border:4px solid #c7dfd2;border-top-color:#236b55;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="paw" aria-hidden="true">🐾</div>
    <div class="app-title">Зоомаркет</div>
    <div class="app-subtitle">Загружаем товары для любимцев…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('app-loading');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
